# Compila el motor .NET a WebAssembly, pasa los tests y publica la web en GitHub Pages.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar wasm-tools
        run: dotnet workload install wasm-tools

      - name: Tests (.NET)
        run: dotnet test

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependencias web
        working-directory: web
        run: npm ci

      - name: Compilar motor WASM
        working-directory: web
        run: npm run engine

      - name: Comprobar tipos, lint y tests de la web
        working-directory: web
        run: npm run typecheck && npm run lint && npm test

      - name: Compilar web
        working-directory: web
        # La web vive en https://<usuario>.github.io/<repositorio>/
        run: |
          npx vite build --base "/${{ github.event.repository.name }}/"
          node scripts/build-pages.mjs
        env:
          # Páginas estáticas para buscadores (privacidad, una por juego, sitemap).
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: App de 3DS (la última versión publicada en Releases)
        # El .cia y el .3dsx se sirven desde la web para instalarlos con FBI por QR.
        run: gh release download --repo ${{ github.repository }} --pattern 'PokeSaveLink.*' --dir web/dist/3ds --clobber || echo "Aún no hay versión de la app de 3DS publicada"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
